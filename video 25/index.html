<script>
    // Promise
    let promise = new Promise(function (resolve, reject) {
        if (success) {
            resolve();
        } else {
            reject();
        }
    });
    // Misol
    function delay(ms) {
        return new Promise((resolve, reject) => {
            setTimeout(() => {
                resolve();
            }, ms);
        });
    }
    function showMessageAfterDelay() { delay(2000).then(() => { console.log('Hello after 2 seconds!'); }); }

    // Error handling
    const myPromise = new Promise((resolve, reject) => {
        setTimeout(() => {
            reject("foo");
        }, 300);
    });
    myPromise
        .then((result) => console.log(result))
        .catch((error) => console.log(error))
</script>
