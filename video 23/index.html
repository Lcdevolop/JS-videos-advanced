<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<script>
    // Synchronous 
    const user = {
        name: 'Ulugbek',
        age: 26
    };
    alert(user.name);
    console.log(user)

    // Asynchronous
    const userr = {
        name: "Ali",
        age: 25
    }
    setTimeout( () => {
       alert(userr.name);
    }, 2000)
    console.log(userr);
    
</script>

<body>

</body>

</html>
